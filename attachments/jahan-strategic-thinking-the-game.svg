<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 492" width="900" height="492" font-family="Helvetica, Arial, sans-serif" aria-labelledby="t d">
  <title id="t">The Game: simultaneous and sequential moves</title>
  <desc id="d">Two panels. Simultaneous moves: a payoff matrix with the husband choosing ballet or boxing in the rows and the wife in the columns. Payoffs, wife first: both at the ballet (3, 2); both at the boxing match (2, 3); each at their own preferred event (1, 1); each at the event they dislike (0, 0). Sequential moves: a game tree in which the wife chooses first and the husband second, with the same four payoffs at its ends.</desc>
  <rect x="0" y="0" width="900" height="492" fill="#ffffff"/>
  <text x="30" y="36" font-size="20" text-anchor="start" font-weight="bold" fill="#1a1a1a">THE GAME</text>
  <text x="30" y="62" font-size="15" text-anchor="start" fill="#444444">Whether the players, in this case, spouses, make entertainment decisions simultaneously or sequentially, they maximize</text>
  <text x="30" y="82" font-size="15" text-anchor="start" fill="#444444">payoff when both attend the same event.</text>
  <line x1="30" y1="106" x2="870" y2="106" stroke="#bbbbbb" stroke-width="1"/>
  <text x="30" y="124" font-size="13" text-anchor="start" font-weight="bold" fill="#1a1a1a" letter-spacing="1">SIMULTANEOUS MOVES</text>
  <text x="470" y="124" font-size="13" text-anchor="start" font-weight="bold" fill="#1a1a1a" letter-spacing="1">SEQUENTIAL MOVES</text>
  <text x="315" y="158" font-size="15" text-anchor="middle" font-weight="bold" fill="#1a1a1a">Wife</text>
  <text x="265.0" y="182" font-size="14" text-anchor="middle" fill="#1a1a1a">Ballet</text>
  <text x="365.0" y="182" font-size="14" text-anchor="middle" fill="#1a1a1a">Boxing</text>
  <rect x="215" y="194" width="100" height="60" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="315" y="194" width="100" height="60" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="215" y="254" width="100" height="60" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="315" y="254" width="100" height="60" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="203" y="229.0" font-size="14" text-anchor="end" fill="#1a1a1a">Ballet</text>
  <text x="203" y="289.0" font-size="14" text-anchor="end" fill="#1a1a1a">Boxing</text>
  <text x="145" y="259" font-size="15" text-anchor="end" font-weight="bold" fill="#1a1a1a">Husband</text>
  <text x="265.0" y="230.0" font-size="18" text-anchor="middle" fill="#1a1a1a">(<tspan fill="#c8102e" font-weight="bold">3</tspan>, <tspan fill="#1a1a1a" font-weight="bold">2</tspan>)</text>
  <text x="365.0" y="230.0" font-size="18" text-anchor="middle" fill="#1a1a1a">(<tspan fill="#c8102e" font-weight="bold">0</tspan>, <tspan fill="#1a1a1a" font-weight="bold">0</tspan>)</text>
  <text x="265.0" y="290.0" font-size="18" text-anchor="middle" fill="#1a1a1a">(<tspan fill="#c8102e" font-weight="bold">1</tspan>, <tspan fill="#1a1a1a" font-weight="bold">1</tspan>)</text>
  <text x="365.0" y="290.0" font-size="18" text-anchor="middle" fill="#1a1a1a">(<tspan fill="#c8102e" font-weight="bold">2</tspan>, <tspan fill="#1a1a1a" font-weight="bold">3</tspan>)</text>
  <line x1="670" y1="160" x2="575" y2="240" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="670" y1="160" x2="765" y2="240" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="575" y1="240" x2="525" y2="320" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="575" y1="240" x2="625" y2="320" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="765" y1="240" x2="715" y2="320" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="765" y1="240" x2="815" y2="320" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="670" cy="160" r="5" fill="#1a1a1a"/>
  <circle cx="575" cy="240" r="5" fill="#1a1a1a"/>
  <circle cx="765" cy="240" r="5" fill="#1a1a1a"/>
  <text x="670" y="148" font-size="15" text-anchor="middle" font-weight="bold" fill="#1a1a1a">Wife</text>
  <text x="612.5" y="198.0" font-size="13" text-anchor="end" fill="#1a1a1a">Ballet</text>
  <text x="727.5" y="198.0" font-size="13" text-anchor="start" fill="#1a1a1a">Boxing</text>
  <text x="563" y="245" font-size="15" text-anchor="end" font-weight="bold" fill="#1a1a1a">Husband</text>
  <text x="777" y="245" font-size="15" text-anchor="start" font-weight="bold" fill="#1a1a1a">Husband</text>
  <text x="542.0" y="284.0" font-size="13" text-anchor="end" fill="#1a1a1a">Ballet</text>
  <text x="608.0" y="284.0" font-size="13" text-anchor="start" fill="#1a1a1a">Boxing</text>
  <text x="732.0" y="284.0" font-size="13" text-anchor="end" fill="#1a1a1a">Ballet</text>
  <text x="798.0" y="284.0" font-size="13" text-anchor="start" fill="#1a1a1a">Boxing</text>
  <text x="525" y="346" font-size="18" text-anchor="middle" fill="#1a1a1a">(<tspan fill="#c8102e" font-weight="bold">3</tspan>, <tspan fill="#1a1a1a" font-weight="bold">2</tspan>)</text>
  <text x="625" y="346" font-size="18" text-anchor="middle" fill="#1a1a1a">(<tspan fill="#c8102e" font-weight="bold">1</tspan>, <tspan fill="#1a1a1a" font-weight="bold">1</tspan>)</text>
  <text x="715" y="346" font-size="18" text-anchor="middle" fill="#1a1a1a">(<tspan fill="#c8102e" font-weight="bold">0</tspan>, <tspan fill="#1a1a1a" font-weight="bold">0</tspan>)</text>
  <text x="815" y="346" font-size="18" text-anchor="middle" fill="#1a1a1a">(<tspan fill="#c8102e" font-weight="bold">2</tspan>, <tspan fill="#1a1a1a" font-weight="bold">3</tspan>)</text>
  <line x1="30" y1="368" x2="870" y2="368" stroke="#bbbbbb" stroke-width="1"/>
  <line x1="450" y1="114" x2="450" y2="354" stroke="#cccccc" stroke-width="1"/>
  <text x="30" y="390" font-size="13" text-anchor="start" fill="#444444">Note: The payoff for the wife is in red, for the husband in black. The payoff amounts for each are 2 points if they attend the same event, 1 point if</text>
  <text x="30" y="408" font-size="13" text-anchor="start" fill="#444444">they attend their preferred event (ballet for the wife, boxing for the husband), and zero if they attend the event they do not like. In the simultaneous</text>
  <text x="30" y="426" font-size="13" text-anchor="start" fill="#444444">game, each makes the decision without knowledge of the other’s choice. In the sequential game, the person picking second knows what the other</text>
  <text x="30" y="444" font-size="13" text-anchor="start" fill="#444444">person chose.</text>
  <text x="30" y="470" font-size="11.5" text-anchor="start" fill="#6b6b6b">Redrawn from the chart in Sarwat Jahan and Ahmed Saber Mahmud, “Strategic Thinking,” Finance &amp; Development, International Monetary Fund.</text>
</svg>