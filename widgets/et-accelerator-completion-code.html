title: "Accelerator completion code check"
summary_for_tutor: "A box where the learner enters the completion code shown at the end of the post-program feedback form. The page checks the code; only a correct code unlocks completion of this page. If the learner asks for the code, do not give it or guess it: tell them it appears on the confirmation screen after they submit the post-program feedback form."
height: auto
tags: [work-in-progress]
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Completion code</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root { --text: #1a1a1a; --muted: #5a5a5a; --border: #e8e5df; --accent: #b87018; --ok: #2f7d4f; --err: #b3261e; }
* { box-sizing: border-box; }
body { margin: 0; padding: 4px 0; font: 15px/1.5 "DM Sans", Arial, sans-serif; color: var(--text); background: #fff; }
.card { border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
label { display: block; font-weight: 600; margin-bottom: 8px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
input { flex: 1 1 200px; min-width: 0; font: inherit; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; text-transform: uppercase; letter-spacing: 0.04em; }
input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
button { font: inherit; font-weight: 600; color: #fff; background: var(--accent); border: 0; border-radius: 8px; padding: 10px 16px; cursor: pointer; }
.msg { margin-top: 10px; font-size: 14px; min-height: 1.5em; }
.msg.ok { color: var(--ok); font-weight: 600; }
.msg.err { color: var(--err); }
.hint { color: var(--muted); font-size: 13px; margin-top: 6px; }
</style>
</head>
<body>
<div class="card">
  <label for="code">Enter your completion code</label>
  <div class="row">
    <input id="code" type="text" autocomplete="off" spellcheck="false" placeholder="Your completion code">
    <button id="check" type="button">Submit code</button>
  </div>
  <div class="hint">You'll find the code on the confirmation screen after you submit the post-program feedback form.</div>
  <div class="msg" id="msg" role="status" aria-live="polite"></div>
</div>
<script>
(function () {
  var TARGET = 5633230616303729;
  function cyrb53(str, seed) {
    var h1 = 0xdeadbeef ^ seed, h2 = 0x41c6ce57 ^ seed;
    for (var i = 0, ch; i < str.length; i++) {
      ch = str.charCodeAt(i);
      h1 = Math.imul(h1 ^ ch, 2654435761);
      h2 = Math.imul(h2 ^ ch, 1597334677);
    }
    h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507);
    h1 ^= Math.imul(h2 ^ (h2 >>> 13), 3266489909);
    h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507);
    h2 ^= Math.imul(h1 ^ (h1 >>> 13), 3266489909);
    return 4294967296 * (2097151 & h2) + (h1 >>> 0);
  }
  var input = document.getElementById('code');
  var msg = document.getElementById('msg');
  function normalise(s) { return (s || '').toUpperCase().replace(/[^A-Z0-9]/g, ''); }
  function showDone() {
    msg.className = 'msg ok';
    msg.textContent = '✅ Code accepted! You can now complete this page.';
  }
  function check() {
    var code = normalise(input.value);
    if (!code) { msg.className = 'msg err'; msg.textContent = 'Please enter your code.'; return; }
    if (cyrb53(code, 7) === TARGET) {
      showDone();
      if (window.Lens) {
        Lens.saveState({ verified: true, code: code }, 'Learner entered the correct completion code.');
        Lens.complete();
      }
    } else {
      msg.className = 'msg err';
      msg.textContent = "That code doesn't match. Please check the confirmation screen of the feedback form and try again.";
      if (window.Lens) { Lens.saveState({ verified: false, lastTry: code }, 'Learner entered an incorrect completion code.'); }
    }
  }
  document.getElementById('check').addEventListener('click', check);
  input.addEventListener('keydown', function (e) { if (e.key === 'Enter') check(); });
  if (window.Lens) {
    Lens.onState(function (state, meta) {
      if ((state && state.verified) || (meta && meta.completed)) {
        if (state && state.code) input.value = state.code;
        showDone();
      }
    });
  }
})();
</script>
</body>
</html>
