<!--lens-widget
id: '1d20bf4d-91d1-4009-a87e-e34efa00c53d'
title: Your earlier answers, read by a widget
summary_for_tutor: A demo of Lens.getAnswers. The widget reads the learner's answers to two questions earlier in the lens (their strongest objection, and their guess of how many years until transformative AI) and shows them, with the year the guess points to. A button reads the answers again after the learner changes them.
height: auto
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Answers reader demo</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root {
  --bg: #ffffff; --text: #1a1a1a; --muted: #5a5a5a; --border: #e8e5df;
  --accent: #b87018; --accent-hover: #9a5c10;
  --font-ui: "DM Sans", Arial, sans-serif; --font-heading: "Newsreader", Georgia, serif;
}
* { box-sizing: border-box; }
body { margin: 0; padding: 16px; font: 14px/1.5 var(--font-ui); color: var(--text); background: var(--bg); }
h2 { font-family: var(--font-heading); font-weight: 600; font-size: 20px; margin: 0 0 4px; }
.intro { color: var(--muted); margin: 0 0 12px; }
.card { border: 1px solid var(--border); border-radius: 8px; padding: 12px 16px; margin-bottom: 10px; }
.eyebrow { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
.answer { white-space: pre-wrap; overflow-wrap: anywhere; }
.missing { color: var(--muted); font-style: italic; }
.year { margin-top: 6px; color: var(--accent); font-weight: 600; }
button { font: inherit; color: inherit; border: 1px solid var(--border); border-radius: 8px; background: #fff; padding: 8px 12px; cursor: pointer; }
button:hover { background: #faf8f3; }
</style>
</head>
<body>
  <h2>Read by a widget</h2>
  <p class="intro">This box is a widget. It asks the platform for your answers with <code>Lens.getAnswers</code> and works with them.</p>
  <div id="cards"></div>
  <button id="again" type="button">Read my answers again</button>

  <script>
  var OBJECTION = "3e1a5838-95df-4d05-a88a-1b4ca868905f";
  var YEARS = "8a3ae4f5-4d86-42dc-b126-b293f88a7b61";
  var cards = document.getElementById("cards");

  function card(label, answer, extra) {
    var box = document.createElement("div");
    box.className = "card";
    var eyebrow = document.createElement("div");
    eyebrow.className = "eyebrow";
    eyebrow.textContent = label;
    var text = document.createElement("div");
    text.className = answer == null ? "answer missing" : "answer";
    text.textContent = answer == null ? "Not answered yet." : answer;
    box.appendChild(eyebrow);
    box.appendChild(text);
    if (extra) {
      var more = document.createElement("div");
      more.className = "year";
      more.textContent = extra;
      box.appendChild(more);
    }
    cards.appendChild(box);
  }

  function yearFrom(answer) {
    var match = answer == null ? null : String(answer).match(/\d+(\.\d+)?/);
    if (!match) return null;
    var year = new Date().getFullYear() + Math.round(Number(match[0]));
    return "That points to around " + year + ".";
  }

  function notice(text) {
    cards.textContent = "";
    var p = document.createElement("p");
    p.className = "missing";
    p.textContent = text;
    cards.appendChild(p);
  }

  function read() {
    if (!window.Lens) {
      notice("Open this page on the Lens platform to see your answers here.");
      return;
    }
    if (!window.Lens.getAnswers) {
      notice("This version of the platform cannot read answers yet.");
      return;
    }
    window.Lens.getAnswers([OBJECTION, YEARS]).then(function (answers) {
      cards.textContent = "";
      card("Your strongest objection", answers[OBJECTION]);
      card("Years until transformative AI", answers[YEARS], yearFrom(answers[YEARS]));
    }, function () {
      notice("Your answers could not be loaded.");
    });
  }

  document.getElementById("again").addEventListener("click", read);
  read();
  </script>
</body>
</html>
