<!--lens-widget
id: '1d20bf4d-91d1-4009-a87e-e34efa00c53d'
title: Your earlier answers, read by a widget
summary_for_tutor: A demo of Lens.onAnswers and Lens.goToQuestion. The widget reads the learner's answers to two questions earlier in the lens (their strongest objection, and their guess of how many years until transformative AI) together with the questions themselves, and shows each question with the answer and a "Go to question" button. For the years guess it also shows the year and the number of days from today it points to. It updates by itself when the learner changes one of those answers.
height: auto
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Answers reader demo</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root {
  --bg: #ffffff; --text: #1a1a1a; --muted: #5a5a5a; --border: #e8e5df;
  --accent: #b87018; --accent-hover: #9a5c10;
  --font-ui: "DM Sans", Arial, sans-serif; --font-heading: "Newsreader", Georgia, serif;
}
* { box-sizing: border-box; }
body { margin: 0; padding: 16px; font: 14px/1.5 var(--font-ui); color: var(--text); background: var(--bg); }
h2 { font-family: var(--font-heading); font-weight: 600; font-size: 20px; margin: 0 0 4px; }
.intro { color: var(--muted); margin: 0 0 12px; }
.card { border: 1px solid var(--border); border-radius: 8px; padding: 12px 16px; margin-bottom: 10px; }
.eyebrow { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
.title { font-weight: 600; }
.question { color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere; margin-bottom: 8px; }
.answer { white-space: pre-wrap; overflow-wrap: anywhere; border-left: 3px solid var(--border); padding-left: 10px; }
.missing { color: var(--muted); font-style: italic; }
.result { margin-top: 8px; color: var(--accent); font-weight: 600; }
.go { margin-top: 10px; }
button { font: inherit; color: inherit; border: 1px solid var(--border); border-radius: 8px; background: #fff; padding: 8px 12px; cursor: pointer; }
button:hover { background: #faf8f3; }
</style>
</head>
<body>
  <h2>Read by a widget</h2>
  <p class="intro">This box is a widget. It gets your answers and their questions from the platform with <code>Lens.onAnswers</code>, which hands it new ones as soon as you change an answer, works with them, and takes you back to a question with <code>Lens.goToQuestion</code>.</p>
  <div id="cards"></div>
  <button id="again" type="button">Read my answers again</button>

  <script>
  var OBJECTION = "3e1a5838-95df-4d05-a88a-1b4ca868905f";
  var YEARS = "8a3ae4f5-4d86-42dc-b126-b293f88a7b61";
  var cards = document.getElementById("cards");

  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text != null) node.textContent = text;
    return node;
  }

  // The years guess as a date: the year it points to and the days until then.
  function fromYears(answer) {
    var match = answer == null ? null : String(answer).match(/\d+(\.\d+)?/);
    if (!match) return null;
    var years = Number(match[0]);
    var days = Math.round(years * 365.2425);
    var when = new Date(Date.now() + days * 86400000);
    return "That points to around " + when.getFullYear() + ", about " +
      days.toLocaleString("en") + " days from today.";
  }

  function card(id, item, result) {
    var box = el("div", "card");
    if (item.lensTitle) box.appendChild(el("div", "eyebrow", "Question · " + item.lensTitle));
    if (item.questionTitle) box.appendChild(el("div", "title", item.questionTitle));
    if (item.questionText) box.appendChild(el("div", "question", item.questionText));
    box.appendChild(item.answer == null
      ? el("div", "answer missing", "Not answered yet.")
      : el("div", "answer", item.answer));
    if (result) box.appendChild(el("div", "result", result));
    if (item.canGoToQuestion) {
      var go = el("button", "go", "Go to question");
      go.type = "button";
      go.addEventListener("click", function () { window.Lens.goToQuestion(id); });
      box.appendChild(go);
    }
    cards.appendChild(box);
  }

  function notice(text) {
    cards.textContent = "";
    cards.appendChild(el("p", "missing", text));
  }

  function show(answers) {
    cards.textContent = "";
    card(OBJECTION, answers[OBJECTION] || {}, null);
    var years = answers[YEARS] || {};
    card(YEARS, years, fromYears(years.answer));
  }

  function read() {
    window.Lens.getAnswers([OBJECTION, YEARS]).then(show, function () {
      notice("Your answers could not be loaded.");
    });
  }

  var again = document.getElementById("again");
  if (!window.Lens) {
    again.hidden = true;
    notice("Open this page on the Lens platform to see your answers here.");
  } else if (window.Lens.onAnswers) {
    // Live: called now, and again whenever you change one of these answers.
    again.hidden = true;
    window.Lens.onAnswers([OBJECTION, YEARS], show);
  } else if (window.Lens.getAnswers) {
    // An older platform: read once, and again on the button.
    again.addEventListener("click", read);
    read();
  } else {
    again.hidden = true;
    notice("This version of the platform cannot read answers yet.");
  }
  </script>
</body>
</html>
